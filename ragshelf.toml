# ragshelf configuration. Read by src/ragshelf/config.py.
#
# Every key is optional. The commented values below are the defaults, taken
# from docs/decisions/0001-model-stack.md and 0002-pipeline-architecture.md;
# uncomment a line to change it. An unknown key is an error.
#
# Precedence: RAGSHELF_* environment variables, then this file, then the
# defaults. Nested keys use a double underscore in the variable name, for
# example RAGSHELF_RETRIEVAL__RRF_K=30.
#
# Relative paths are taken from the repository root.
# Secrets never go here. The OpenRouter key belongs in .env.

