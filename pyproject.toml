[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragshelf"
version = "0.0.0"
description = "Retrieval-augmented generation over a personal library of text documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Direct imports of src/ragshelf, unpinned.
# The exact versions last installed are recorded in requirements.txt.
dependencies = [
    "docvortex",
    "faiss-cpu",
    "langdetect",
    "mineru[torch]",
    "numpy",
    "pdfplumber",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "pypdf",
    "requests",
    "sentence-transformers",
    "streamlit",
    "tiktoken",
    "torch",
    "transformers",
    # Installed for the selected model stack (docs/research/reports/);
    # not yet imported by the code.
    "bm25s",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
ragshelf = "ragshelf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets test modules import shared helpers: `from fakes import ...`.
pythonpath = ["tests"]
# Tests marked `slow` load real models; run them with `pytest -m slow`.
addopts = "--import-mode=importlib --strict-markers -m 'not slow'"
markers = [
    "slow: loads real models; deselected by default",
]
